[scenario]
name = "malformed-output-recovery"
description = "A tool returns malformed structured output once"
seed = 29

[[steps]]
tool = "fetch_logs"
arguments = { service = "gateway" }
result = { status = "healthy", incidents = 0 }

[[steps]]
tool = "check_metrics"
arguments = { service = "gateway" }
result = { error_rate = 0.01 }

[[faults]]
kind = "malformed_output"
step = 0
occurrence = 1
repeat = 1

